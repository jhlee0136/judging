<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AX 우수사례 심사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1a2233; --sub:#5b6577; --line:#dfe4ec; --soft:#eef2f8;
  --navy:#1f3a68; --navy2:#2c4f8a; --accent:#e8743b; --ok:#1f8a5b; --okbg:#e5f4ec;
  --warn:#b7791f; --warnbg:#fdf3e1; --bad:#c0392b; --badbg:#fbe9e7; --mute:#8a93a3;
  --r:12px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--navy2)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.top .brand{font-weight:700;letter-spacing:-.01em;cursor:pointer}
.top .brand small{font-weight:500;opacity:.75;margin-left:6px}
.top .sp{flex:1}
.top .who{font-size:14px;opacity:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.muted{color:var(--sub)}
.tiny{font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
.b-none{background:var(--soft);color:var(--mute)} .b-bad{background:var(--badbg);color:var(--bad)}
.b-navy{background:#e4eaf5;color:var(--navy)}
.demo{background:#fff7e6;border-bottom:1px solid #f1d9a6;color:#7a5410;font-size:13.5px}
.demo .wrap{padding-top:8px;padding-bottom:8px}

/* landing */
.hero{background:linear-gradient(160deg,var(--navy) 0%,#2b4f86 70%,#36609b 100%);color:#fff;padding:44px 0 90px}
.hero .eyebrow{font-size:13px;letter-spacing:.08em;opacity:.8;font-weight:600}
.hero h1{font-size:clamp(24px,4vw,36px);margin:10px 0 10px;line-height:1.3}
.hero p{opacity:.85;max-width:640px;margin:0}
.land{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:-62px;padding-bottom:40px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.fact{padding:16px}
.fact b{display:block;font-size:24px;color:var(--navy);letter-spacing:-.02em}
.areas{width:100%;border-collapse:collapse;font-size:14px}
.areas th,.areas td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.areas th{color:var(--sub);font-weight:600;font-size:13px;background:var(--soft)}
.areas td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.areas th,.areas td{text-align:center}.areas td.l{text-align:left}
.areas th,.areas td{border-right:1px solid var(--line)}.areas tr>:last-child{border-right:0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:0 0 12px 34px}
.steps .fx{margin:8px 0 4px;padding:8px 12px;background:var(--soft);border-radius:8px;font-weight:600;color:var(--navy);font-size:14px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.login h2{font-size:20px;margin-bottom:4px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.inp:focus{outline:2px solid #b9c9e6;border-color:var(--navy2)}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:20px}

/* judge home */
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:26px 0 16px}
.pagehead h1{font-size:24px}
.prog{flex:1;min-width:220px;max-width:360px;margin-left:auto}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.note{background:#f2f6fc;border:1px solid #d7e2f3;border-radius:var(--r);padding:12px 16px;font-size:14px;margin-bottom:18px}
.note ul{margin:6px 0 0;padding-left:18px}
.grp{margin:22px 0 10px;font-size:15px;color:var(--sub);font-weight:700;display:flex;gap:8px;align-items:center}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.team{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.team:hover{border-color:var(--navy2);transform:translateY(-1px)}
.team .no{font-size:12.5px;color:var(--sub);font-weight:700}
.team .t{font-weight:700;font-size:15.5px;line-height:1.4}
.team .row{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.team .score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}

/* form */
.crumb{margin:18px 0 0;font-size:14px}
.tinfo{margin:12px 0 16px;padding:20px}
.tinfo h1{font-size:21px;line-height:1.4;margin:6px 0}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.links a,.links span{font-size:13.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);text-decoration:none;background:#fff}
.links span{color:var(--mute)}
.viewer{margin:16px 0 0;overflow:hidden}
.tpage.split{max-width:none}
.tpage.split .tlayout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(460px,1fr);gap:20px;align-items:start}
.tpage.split .viewer{position:sticky;top:12px;margin-top:18px;height:calc(100vh - 100px);display:flex;flex-direction:column}
.tpage.split .vbody{flex:1;min-height:0}
.tpage.split .vbody iframe{height:100%}
.tpage.split .vnote{display:none}
.tpage.split .legend{grid-template-columns:1fr}
.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.vbar .sp{flex:1}
.vbody iframe{display:block;width:100%;height:80vh;border:0;background:#525659}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.legend div{padding:10px 12px;font-size:13px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.legend b{display:block;font-size:13.5px}
.area{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.area h2{font-size:17px}
.item{padding:18px 20px;margin-bottom:10px}
.item.miss{border-color:#e7b3ab;box-shadow:0 0 0 3px #fbe9e7}
.ihead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ihead h3{font-size:16px}
.ihead .pts{margin-left:auto;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.iq{margin:8px 0 4px}
.src{font-size:13px;color:var(--sub)}
details.guide{margin:10px 0 2px;background:var(--soft);border-radius:9px;padding:8px 12px;font-size:14px}
details.guide summary{cursor:pointer;font-weight:600;color:var(--navy2)}
details.guide ul{margin:8px 0 2px;padding-left:18px}
details.guide li{margin-bottom:5px}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.g{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;line-height:1.2}
.g b{display:block;font-size:16px}
.g small{color:var(--sub);font-variant-numeric:tabular-nums}
.g:hover{border-color:var(--navy2)}
.g.on{background:var(--navy);border-color:var(--navy);color:#fff}
.g.on small{color:#dbe4f5}
.g:disabled{cursor:default}
.g:disabled:hover{border-color:var(--line)}
.g.on:disabled:hover{border-color:var(--navy)}
textarea.inp{min-height:96px;resize:vertical}
.sticky{position:sticky;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);margin-top:20px;z-index:5}
.sticky .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.subs{display:flex;gap:14px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.subs b{color:var(--ink);font-variant-numeric:tabular-nums}
.total{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;margin-left:auto}
.total small{font-size:14px;color:var(--sub);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:8px;margin:18px 0 6px}

/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--sub);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-color:var(--navy)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{background:var(--soft);color:var(--sub);font-size:12.5px;font-weight:700;white-space:nowrap}
table.t th,table.t td{text-align:center}
table.t td.n,table.t th.n{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.l,table.t th.l{text-align:left}
table.t tr.det>td{text-align:left}
table.t th,table.t td{border-right:1px solid var(--line)}
table.t tr>:last-child{border-right:0}
table.t td.c,table.t th.c{text-align:center}
table.t tr.out td{color:var(--mute)}
table.t tr.det td{background:#fafbfd;padding:12px 14px}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);font-weight:800;color:var(--navy)}
.aw0{background:#f6c445;color:#5a4300}.aw1{background:#e4eaf5;color:var(--navy)}.aw2{background:var(--okbg);color:var(--ok)}
.cmt-team{margin-bottom:12px}
.cmt-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}.cmt-head h3{font-size:16px}.cmt-head .sp{flex:1}
.cmt{border-top:1px solid var(--line);padding:12px 0 10px}.cmt-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.cmt-body{white-space:pre-wrap;line-height:1.65}
.sendbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px;border-color:#c9d6ee}.sendbox>div{flex:1;min-width:240px}
.sendbox.sent{background:var(--okbg);border-color:#bfe3cf}
.awards .aw-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}.awards h3{font-size:16px}
.rank.r1{background:#f6c445;color:#5a4300}.rank.r2{background:#d6dbe3;color:#3a4250}.rank.r3{background:#e6b48a;color:#5a3412}
s.drop{color:var(--mute)}
.mx td.cell{text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.mx td.tm{white-space:nowrap}
.mx td.cell:hover{background:#f2f6fc}
.cell .badge{min-width:46px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:22px;color:var(--navy)}
.formula{font-size:14px}
.formula code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:440px;width:100%;padding:22px}
.modal h3{font-size:18px;margin-bottom:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.code{font-size:30px;font-weight:800;letter-spacing:.12em;text-align:center;padding:16px;background:var(--soft);border-radius:10px;margin:12px 0;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2233;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.spin{padding:60px 0;text-align:center;color:var(--sub)}

.land>div{min-width:0}
@media (max-width:480px){.facts{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fact{padding:12px}.fact b{font-size:20px}.areas td.n,.areas th.n{white-space:normal}}
@media (max-width:860px){
  .land{grid-template-columns:1fr}
  .facts,.kpis{grid-template-columns:repeat(2,1fr)}
  .legend{grid-template-columns:1fr}
  .grades{grid-template-columns:repeat(3,1fr)}
  .total{margin-left:0}
}
.printonly{display:none}
.phead{margin-bottom:12px}
.phead h1{font-size:18px;margin-bottom:6px}
.phead div{font-size:11.5px;color:#333;margin-top:2px}
@media print{
  @page{size:A4 landscape;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.tabs,.toolbar,.btn,.demo,.noprint,.pagehead,.kpis,.toast{display:none!important}
  .printonly{display:block!important}
  html,body{background:#fff;font-size:11px}
  .wrap{max-width:none;padding:0}
  .tbl-wrap,.card{box-shadow:none;border-color:#bbb}
  .tbl-wrap{overflow:visible}
  table.t{font-size:10.5px}
  table.t th,table.t td{padding:5px 6px}
  table.t tr{break-inside:avoid}
  .awards,.formula,.cmt{break-inside:avoid}
  table.t tr.out td{color:#666}
  .rank{width:22px;height:22px}
}
</style>
</head>
<body>
<div id="demo"></div>
<header class="top"><div class="wrap" id="top"></div></header>
<main id="app"></main>

<script>
/* ===== 설정: 심사용 Supabase 프로젝트 (비워 두면 이 브라우저 안에서만 동작하는 시연 모드) ===== */
const CFG = { url: 'https://qxocbfjymyehpviehile.supabase.co', key: 'sb_publishable_yvE2inhK4V2jh7l3tKjVgw_kwsAYZXW' };

/* ===== 심사기준 ===== */
const GR = ['S','A','B','C','D','E'], RT = [1, .8, .6, .4, .2, 0];
const AREAS = [
  { name:'창의·혁신성', max:30, items:[0,1] },
  { name:'효과성', max:30, items:[2,3] },
  { name:'확산성', max:20, items:[4,5] },
  { name:'완성도', max:20, items:[6,7] },
];
const CRIT = [
  { name:'독창성 및 차별성', max:15,
    q:'기존 교육·행정 방식 및 타 사례와 비교하여, AI를 적용한 접근 방식과 기획 아이디어가 독창적이고 차별화되는가?',
    src:'결과보고서 2. 추진 배경, 4. 추진 내용',
    pts:[['접근 방식의 신선함','기존 시스템에 챗봇 탭을 추가하는 수준을 넘어, 업무·교육 프로세스 자체를 재정의(AX)하려는 시도가 돋보이는가?'],
         ['기존 방식과의 격차','수작업 또는 전통적 IT 방식 대비 AI 도입으로 얻는 기획적 차별점이 명확한가?'],
         ['타 대학·공공 사례 비교','널리 상용화된 흔한 활용 사례를 단순 복제한 수준이 아니라, 기관 특성에 맞게 독창적으로 기획되었는가?']] },
  { name:'AI 활용의 정교성', max:15,
    q:'목적에 적합한 AI 도구를 선정하고, 프롬프트·데이터·시스템 연동 등 기술적 응용 및 조합 구조가 정교한가?',
    src:'결과보고서 4-1) 활용 AI 도구, 4-2) 추진 과정',
    pts:[['AI 모델·도구 선정의 타당성','문제 특성에 맞는 AI 엔진(LLM, STT/TTS, Vision, RAG 등)을 적재적소에 선택했는가?'],
         ['파이프라인 정교함','단일 질의응답을 넘어 프롬프트 엔지니어링, API 연동, DB·지식베이스(RAG) 조합 등 연동 구조가 정교하게 설계되었는가?'],
         ['기술적 예외 처리','환각 방지, 답변 정밀도 향상, 보안 요소 등을 고려한 기술적 장치가 반영되었는가?']] },
  { name:'문제 해결 및 목적 달성도', max:20,
    q:'기획 단계에서 도출한 교육·행정 현장의 문제점 및 추진 목적을 개발 결과물이 실질적으로 해결하고 달성하였는가?',
    src:'결과보고서 3. 추진 목적, 5. 주요 성과, 시제품 시연 영상·링크',
    pts:[['Problem-Solution Fit','기획 서두에서 제기한 현장의 핵심 페인 포인트를 실제 개발물로 해결했는가?'],
         ['목적 달성 수준','당초 설정한 핵심 기능과 목적 달성 범위가 빠짐없이 상응하는가?'],
         ['실효성','서류상 이론에 그치지 않고 현장 적용 시 체감 만족도나 업무 개선 효과를 내는 구조인가?']],
    strict:'최고 배점 문항입니다. 결과보고서의 기획 내용과 시제품 작동 모습이 부합하는지 엄격히 점검하세요.' },
  { name:'정량·정성적 기대성과', max:10,
    q:'제시된 성과(업무 효율, 예산/시간 절감 등)의 산출 근거가 객관적이고 구체적이며, 기대되는 파급 성과가 명확한가?',

async function rpcRaw(fn, args) {
  if (!CFG.url) return Mock.call(fn, args);
  const headers = { 'Content-Type':'application/json', apikey: CFG.key };
  if (!CFG.key.startsWith('sb_')) headers.Authorization = 'Bearer ' + CFG.key;
  let r;
  try { r = await fetch(CFG.url.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, { method:'POST', headers, body: JSON.stringify(args) }); }
  catch { throw new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'); }
  if (!r.ok) throw new Error('서버 응답 오류(' + r.status + ')');
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return d;
}

    if (db.recuse.some(r => r.judge_no === no && r.team_no === a.p_team)) return err('회피 대상 평가팀입니다.');
    for (let i = 0; i < 8; i++) {
      const v = a.p_items[i];
      if (v != null && !RT.map(r => MAX[i] * r).includes(v)) return err((i + 1) + '번 항목 점수가 등급 점수가 아닙니다.');
    }
    const i = db.scores.findIndex(s => s.judge_no === no && s.team_no === a.p_team);
    const row = { judge_no:no, team_no:a.p_team, items:a.p_items, comment:(a.p_comment || '').slice(0, 2000), submitted:false, updated_at:new Date().toISOString() };
    i >= 0 ? db.scores[i] = row : db.scores.push(row);
    return payload(db, no);
  }
  function mAdmin(db, a) {
    if (!auth(db, 0, a.p_code)) return err('관리자 접속코드가 맞지 않습니다.');
    const g = a.p_args || {}, j = g.judge_no, t = g.team_no; let code = null;
    const drop = () => db.scores = db.scores.filter(s => !(s.judge_no === j && s.team_no === t));
    switch (a.p_action) {
      case 'set_judge': db.judges.find(x => x.no === j && j > 0).name = String(g.name).trim().slice(0, 40); break;
      case 'issue_code': { const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let k = 0; k < 8; k++) c += al[Math.floor(Math.random() * 32)];
        code = c.slice(0, 4) + '-' + c.slice(4); db.judges.find(x => x.no === j).code = norm(code); break; }
      case 'unlock': db.scores.forEach(s => { if (s.judge_no === j && s.team_no === t) s.submitted = false; }); break;
      case 'delete_score': drop(); break;
      case 'recuse': if (g.on) { if (!db.recuse.some(r => r.judge_no === j && r.team_no === t)) db.recuse.push({ judge_no:j, team_no:t }); drop(); }
                     else db.recuse = db.recuse.filter(r => !(r.judge_no === j && r.team_no === t)); break;
      case 'set_team': Object.assign(db.teams.find(x => x.team_no === t), { report_url:g.report_url || '', demo_url:g.demo_url || '', video_url:g.video_url || '' }); break;
      case 'close': db.closed = !!g.closed; break;
      case 'demo_fill': {   // 시연용 예시 점수: 위원마다 채점 성향(관대·엄격)을 다르게
        db.scores = [];
        const bias = [0, .25, -.35, .1, -.1, .45, -.2];
        for (const jj of [1,2,3,4,5,6]) for (const tm of db.teams) {
          if (db.recuse.some(r => r.judge_no === jj && r.team_no === tm.team_no)) continue;
          const q = ((tm.team_no * 37) % 11) / 10 - .5;
          const items = MAX.map((m, k) => { const x = 1.6 + q * 2 + bias[jj] * 2.2 + (((jj * 13 + tm.team_no * 7 + k * 5) % 7) - 3) * .35;
            return m * RT[Math.max(0, Math.min(5, Math.round(x)))]; });
          db.scores.push({ judge_no:jj, team_no:tm.team_no, items, comment:'', submitted:true, updated_at:new Date().toISOString() });
        }
        db.sent = [1,2,3,4,5,6].map(n => ({ judge_no:n, at:new Date().toISOString() }));
        break; }
      case 'demo_reset': Object.assign(db, fresh()); break;
      case 'load': break;
      default: return err('알 수 없는 작업입니다.');
    }
    const out = Object.assign(payload(db, 0), {
      judges: db.judges.filter(x => x.no > 0).map(x => ({ no:x.no, name:x.name, has_code:!!x.code })),
      recuse: db.recuse,
    });
    if (code) out.new_code = code;
    return out;
  }
  return { call };
})();

/* ===== 결과보고서 PDF: 1MB 조각으로 올리고 받아서 브라우저 안에서 합침 ===== */
const CHUNK = 1024 * 1024, PDF_MAX = 50 * 1024 * 1024;
const fileOf = t => (D?.files || []).find(f => f.team_no === t);
const fsize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
const toB64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] || '');
  r.onerror = () => rej(new Error('파일을 읽지 못했습니다.'));
  r.readAsDataURL(blob);
});
async function uploadPdf(team, file, onProg) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') throw new Error('PDF 파일만 올릴 수 있습니다.');
  if (!file.size || file.size > PDF_MAX) throw new Error('파일 크기는 50MB 이하여야 합니다.');
  const total = Math.ceil(file.size / CHUNK);
  for (let i = 0; i < total; i++) {
    const data = await toB64(file.slice(i * CHUNK, (i + 1) * CHUNK));
    await rpc('jd_file_put', { p_code:S.code, p_team:team, p_idx:i, p_total:total, p_name:file.name, p_size:file.size, p_data:data });
    onProg(i + 1, total);
  }
}
const pdfCache = {};
async function loadPdf(team, onProg) {
  const f = fileOf(team), key = team + '|' + f.uploaded_at;
  if (pdfCache[key]) return pdfCache[key];
  const parts = [];
  for (let i = 0; i < f.chunks; i++) {
    const r = await rpc('jd_file_get', { p_judge:S.no, p_code:S.code, p_team:team, p_idx:i });
    const bin = atob(r.data), u = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
    parts.push(u); onProg && onProg(i + 1, f.chunks);
  }
  return pdfCache[key] = { url:URL.createObjectURL(new Blob(parts, { type:'application/pdf' })), name:f.name };
}

/* ===== 집계: 최고·최저 제외 평균, 심사위원별 Z 표준화 ===== */
function trim(vals) {
  const n = vals.length;
  if (!n) return { avg:null, drop:[] };
  if (n < 3) return { avg:mean(vals), drop:[] };
  let lo = 0, hi = 0;
  vals.forEach((v, i) => { if (v < vals[lo]) lo = i; if (v > vals[hi]) hi = i; });
  if (lo === hi) hi = (lo + 1) % n;                       // 모두 같은 점수
  return { avg:mean(vals.filter((_, i) => i !== lo && i !== hi)), drop:[lo, hi] };
}
function compute() {
  const total = s => sum(s.items);
  const sub = D.scores.filter(s => s.submitted);
  const J = {};
  D.judges.forEach(j => {
    const v = sub.filter(s => s.judge_no === j.no).map(total), n = v.length, m = mean(v);
    const sd = n ? Math.sqrt(sum(v.map(x => (x - m) ** 2)) / n) : null;
    const expect = D.teams.filter(t => !D.recuse.some(r => r.judge_no === j.no && r.team_no === t.team_no)).length;
    J[j.no] = { n, m, sd, expect };
  });
  const rows = D.teams.map(t => {
    const ent = sub.filter(s => s.team_no === t.team_no).sort((a, b) => a.judge_no - b.judge_no).map(s => {
      const r = total(s), st = J[s.judge_no], z = st.n >= 2 && st.sd > 0 ? (r - st.m) / st.sd : 0;
      return { judge:s.judge_no, raw:r, z, items:s.items, comment:s.comment };
    });
    const rT = trim(ent.map(e => e.raw)), zT = trim(ent.map(e => e.z));
    const expect = D.judges.length - D.recuse.filter(r => r.team_no === t.team_no).length;
    const q3 = mean(ent.map(e => e.items[2]));
    const exc = (D.excluded || []).find(x => x.team_no === t.team_no) || null;
    return { team:t, ent, rawAvg:rT.avg, rawDrop:rT.drop, zAvg:zT.avg, zDrop:zT.drop, n:ent.length, expect, q3, exc,
             ok: rT.avg != null && rT.avg >= CUT && !exc };
  });
  // 순위: 시상 가능 팀(원점수 평균 70점 이상, 관리자 제외 아님)만으로 매김
  // 비교: Z점수 평균 → 원점수 평균 → 문항 3 평균. 부동소수 오차(1e-9 미만)는 같은 값으로 봄
  const near = (x, y) => Math.abs(x - y) < 1e-9;
  const cmp = (a, b) => !near(a.zAvg, b.zAvg) ? b.zAvg - a.zAvg : !near(a.rawAvg, b.rawAvg) ? b.rawAvg - a.rawAvg : !near(a.q3, b.q3) ? b.q3 - a.q3 : 0;
  const ok = rows.filter(r => r.ok).sort(cmp);
  ok.forEach((r, i) => r.rank = i && !cmp(ok[i - 1], r) ? ok[i - 1].rank : i + 1);
  // 시상: 대상 = 전체 상위 N팀, 우수상·장려상 = 대상 팀을 뺀 분야별 순위(분야마다 팀 수 설정)
  const fields = [...new Set(D.teams.map(t => t.field))], cfg = awCfg();
  ok.slice(0, cfg.grand).forEach(r => r.award = '대상');
  if (cfg.grand && ok[cfg.grand] && !cmp(ok[cfg.grand - 1], ok[cfg.grand])) ok[cfg.grand - 1].tie = ok[cfg.grand].tie = true;   // 대상 경계 동점
  for (const fd of fields) {
    const c = cfg.f(fd), list = ok.filter(r => r.team.field === fd && r.award !== '대상');
    list.forEach((r, i) => { r.frank = i && !cmp(list[i - 1], r) ? list[i - 1].frank : i + 1;
      r.award = r.frank <= c.best ? '우수상' : r.frank <= c.best + c.enc ? '장려상' : null; });
    // 같은 분야에서 동점인데 시상 구분이 갈리거나, 동점으로 수상팀 수가 넘치면 표시
    list.forEach(r => { r.tie = r.tie || (list.some(o => o !== r && !cmp(o, r)) && (list.some(o => o !== r && !cmp(o, r) && o.award !== r.award)
      || (!!r.award && list.filter(o => o.award === r.award).length > awN(c, r.award)))); });
  }
  const byZ = (a, b) => (b.zAvg ?? -99) - (a.zAvg ?? -99);
  const rest = [...rows.filter(r => r.exc).sort(byZ), ...rows.filter(r => !r.exc && !r.ok).sort(byZ)];
  const complete = rows.every(r => r.n >= r.expect);
  return { J, rows:[...ok, ...rest], ok, fields, complete, nSub:sub.length };
}

/* ===== 관리자 ===== */
async function adminDo(action, args = {}) {
  if (!isAdmin()) return null;                 // 관리자 세션이 아니면 관리자 요청을 보내지 않음
  try { D = await rpc('jd_admin', { p_code:S.code, p_action:action, p_args:args }); return D; }
  catch (e) { if (!AUTH_FAIL.test(e.message)) toast(e.message); return null; }
}
const jname = no => D.judges.find(j => j.no === no)?.name || '심사위원 ' + no;
function renderAdmin() {
  renderTop();
  const tabs = [['judges','심사위원 관리'],['teams','평가자료 등록'],['progress','진행 현황'],['comments','심사 의견'],['settings','심사 마감'],['result','결과·순위']];
  if (!tabs.some(t => t[0] === adminTab)) adminTab = 'judges';
  $('#app').innerHTML = `<div class="wrap">
    <div class="pagehead"><div><h1>평가점수 관리</h1><div class="muted">${D.closed ? '<span class="badge b-bad">심사 마감</span>' : '<span class="badge b-ok">심사 진행 중</span>'} <span class="tiny">마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')}</span></div></div>
      <div style="margin-left:auto" class="noprint"><button class="btn sm" id="rf">새로고침</button></div></div>
    <nav class="tabs">${tabs.map(t => `<button class="tab ${t[0] === adminTab ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav>
    <div id="pane"></div><div style="height:40px"></div></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => go('#/admin/' + b.dataset.t));
  $('#rf').onclick = async () => { if (await adminDo('load')) { renderAdmin(); toast('최신 점수를 불러왔습니다.'); } };
  ({ result:paneResult, progress:paneProgress, comments:paneComments, judges:paneJudges, teams:paneTeams, settings:paneSettings })[adminTab]();
  // 자동 갱신 타이머는 항상 하나만(다시 그릴 때마다 이전 타이머를 지움). 관리자 로그인이 아니면 즉시 멈춤
  clearInterval(timer); timer = null;
  if (adminTab === 'result' || adminTab === 'progress' || adminTab === 'comments') {
    const id = timer = setInterval(async () => {
      if (!isAdmin() || timer !== id) return clearInterval(id);
      if (document.hidden || document.querySelector('.modal')) return;
      if (await adminDo('load') && isAdmin() && timer === id) renderAdmin();
    }, 30000);
  }
}

const AW_CLS = { '대상':'aw0', '우수상':'aw1', '장려상':'aw2' };
function statusCell(r) {
  if (r.exc) return '<span class="badge b-bad">시상 제외</span>';
  if (r.rawAvg == null) return '<span class="badge b-none">미집계</span>';
  if (!r.ok) return `<span class="badge b-bad">${CUT}점 미만</span>`;
  return r.award ? `<span class="badge ${AW_CLS[r.award]}">${r.award}</span>` : '<span class="badge b-none">선정 외</span>';
}
function awardSummary(C) {
  const cfg = awCfg(), grand = C.ok.filter(r => r.award === '대상');
  const pick = (fd, name) => C.ok.filter(r => r.team.field === fd && r.award === name);
  const gap = (have, want) => have < want ? ` <span class="badge b-warn">${want - have}팀 부족</span>` : have > want ? ` <span class="badge b-warn">${have - want}팀 초과(동점)</span>` : '';
  const tiers = AW_NAMES.map(name => ({ name, fs: C.fields.filter(fd => awN(cfg.f(fd), name) > 0) })).filter(x => x.fs.length);
  const none = !cfg.grand && !tiers.length;
  // 표 한 줄 = 수상팀 한 팀. 구분은 상 단위로, 분야·규모는 분야 단위로 칸을 합침
  const groups = [];
  if (cfg.grand) groups.push({ name:'대상', parts:[{ fd:'전체', want:cfg.grand, rs:grand }] });
  tiers.forEach(tr => groups.push({ name:tr.name, parts:tr.fs.map(fd => ({ fd, want:awN(cfg.f(fd), tr.name), rs:pick(fd, tr.name) })) }));
  const team = r => `<td class="l"><b>${h(r.team.title)}</b>${r.tie ? ' <span class="badge b-warn">동점</span>' : ''}</td>
    <td class="tiny">${h(r.team.members)}</td><td class="n">${f(r.rawAvg)}</td><td class="n"><b>${f(r.zAvg, 3)}</b></td>`;
  const body = groups.map(g => {
    const span = sum(g.parts.map(pt => Math.max(1, pt.rs.length)));
    return g.parts.map((pt, pi) => (pt.rs.length ? pt.rs : [null]).map((r, ri) => `<tr>
      ${pi === 0 && ri === 0 ? `<td rowspan="${span}"><span class="badge ${AW_CLS[g.name]}">${g.name}</span></td>` : ''}
      ${ri === 0 ? `<td rowspan="${Math.max(1, pt.rs.length)}">${h(pt.fd)}</td><td rowspan="${Math.max(1, pt.rs.length)}">${pt.want}팀${gap(pt.rs.length, pt.want)}</td>` : ''}
      ${r ? team(r) : '<td class="l"><span class="muted">해당 팀 없음</span></td><td></td><td></td><td></td>'}</tr>`).join('')).join('');
  }).join('');
  return `<div class="card pad awards">
    <div class="aw-head"><h3>시상 결과 ${C.complete ? '' : '<span class="badge b-warn">잠정</span>'}</h3><span class="muted tiny">대상은 전체 순위, 우수상·장려상은 대상 팀을 뺀 분야별 순위</span><span style="flex:1"></span><button class="btn sm noprint" id="aws">시상 규모 설정</button></div>
    ${none ? '<div class="muted">시상 규모가 모두 0팀으로 설정되어 있습니다(시상 없음). ‘시상 규모 설정’에서 바꿀 수 있습니다.</div>' : `
    <div class="tbl-wrap"><table class="t aw-t"><thead><tr><th>구분</th><th>분야</th><th>규모</th><th>수상팀</th><th>참가자</th><th class="n">원점수 평균</th><th class="n">Z점수 평균</th></tr></thead><tbody>
      ${body}
    </tbody></table></div>`}
    ${C.ok.some(r => r.tie && r.award) ? '<div class="tiny" style="color:var(--warn);margin-top:8px">시상 경계에 동점(Z점수·원점수·문항 3 평균이 모두 같음)이 있습니다. 심사위원회에서 확인하세요.</div>' : ''}
  </div>`;
}

          <td class="c"><span class="badge ${r.n >= r.expect ? 'b-ok' : 'b-warn'}">${r.n}/${r.expect}</span></td>

      <tr><td class="muted l">위원별 평가 완료</td>${D.judges.map(j => { const st = C.J[j.no];
        const full = D.scores.filter(s => s.judge_no === j.no && isFull(s)).length;
        return `<td class="c"><span class="badge ${full >= st.expect ? 'b-navy' : 'b-warn'}">${full}/${st.expect}</span></td>`; }).join('')}<td></td><td></td><td></td></tr>
      <tr><td class="muted l">결과 전송</td>${D.judges.map(j => sentAt(j.no)
        ? `<td class="c"><span class="badge b-ok" title="${new Date(sentAt(j.no)).toLocaleString('ko-KR')}">전송됨</span><div style="margin-top:4px"><button class="btn sm us" data-j="${j.no}">전송 취소</button></div></td>`
        : '<td class="c"><span class="badge b-none">미전송</span></td>').join('')}<td></td><td></td><td></td></tr>
      <tr><td class="muted l">위원 평균 · 표준편차</td>${D.judges.map(j => { const st = C.J[j.no];
        return `<td class="c tiny muted">${st.n ? f(st.m, 1) + ' · ' + f(st.sd, 1) : '–'}</td>`; }).join('')}<td></td><td></td><td></td></tr>
      </tbody></table></div>`;
  document.querySelectorAll('td.cell').forEach(td => td.onclick = async () => {
    const j = +td.dataset.j, t = +td.dataset.t;
    const s = D.scores.find(x => x.judge_no === j && x.team_no === t), rec = D.recuse.some(r => r.judge_no === j && r.team_no === t);
    const team = D.teams.find(x => x.team_no === t);
    const acts = [{ label:'닫기', value:null }];
    if (s) acts.push({ label:'점수 삭제', value:'delete_score', cls:'danger' });
    acts.push(rec ? { label:'회피 해제', value:'unrecuse' } : { label:'회피 지정', value:'recuse' });
    const st = rec ? '회피 지정됨' : !s ? '미평가' : s.submitted ? `전송됨 · ${sum(s.items)}점` : isFull(s) ? `평가 완료(전송 전) · ${sum(s.items)}점` : `작성 중 · ${sum(s.items)}점`;
    const v = await modal(`${jname(j)} · ${t}번`, `<p class="muted" style="margin:0 0 6px">${h(team.title)}</p><p style="margin:0">상태: <b>${st}</b></p>
      <p class="tiny muted">회피 지정: 이 위원에게 해당 사례가 보이지 않고 점수는 삭제되며 집계에서 빠집니다. 전송된 점수를 고치게 하려면 아래 ‘결과 전송’ 줄 또는 심사위원 관리에서 <b>전송 취소</b>를 누르세요.</p>`, acts);
    if (!v) return;
    if ((v === 'delete_score' || v === 'recuse') && s && !await confirmBox('확인', `${h(jname(j))}의 ${t}번 사례 점수가 삭제됩니다. 계속할까요?`, '삭제', 'danger')) return;
    const ok = v === 'recuse' || v === 'unrecuse' ? await adminDo('recuse', { judge_no:j, team_no:t, on: v === 'recuse' }) : await adminDo(v, { judge_no:j, team_no:t });
    if (ok) { renderAdmin(); toast('반영했습니다.'); }
  });
  bindUnsend();
}
// 전송 취소: 그 위원의 모든 점수를 다시 수정 가능하게(결과·순위에서는 다시 전송할 때까지 빠짐)
function bindUnsend() {
  document.querySelectorAll('.us').forEach(b => b.onclick = async () => {
    const j = +b.dataset.j;
    if (!await confirmBox('전송 취소', `<b>${h(jname(j))}</b>의 결과 전송을 취소합니다. 위원이 점수를 다시 고칠 수 있고, 다시 전송할 때까지 이 위원의 점수는 결과·순위에서 빠집니다.`, '전송 취소', 'danger')) return;
    try { await rpc('jd_unsend', { p_code:S.code, p_judge:j }); await adminDo('load'); renderAdmin(); toast('전송을 취소했습니다. 위원이 다시 수정할 수 있습니다.'); }
    catch (e) { toast(e.message); }
  });
}

function download(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const stamp = () => new Date().toISOString().slice(0, 10);
function exportCSV(C) {
  const head = ['전체순위','분야순위','번호','분야','지원주제','사례명','구분','참가자','전송위원수','원점수평균(최고최저제외)','Z점수평균(최고최저제외)','시상','제외사유'];
  D.judges.forEach(j => head.push(j.name + ' 원점수', j.name + ' Z점수'));
  const rows = C.rows.map(r => {
    const row = [r.ok ? r.rank : '', r.frank ?? '', r.team.team_no, r.team.field, r.team.theme, r.team.title, r.team.kind, r.team.members, r.n,
      r.rawAvg == null ? '' : r.rawAvg.toFixed(2), r.zAvg == null ? '' : r.zAvg.toFixed(3), r.exc ? '시상 제외' : r.rawAvg == null ? '미집계' : !r.ok ? CUT + '점 미만' : r.award || '선정 외', r.exc ? r.exc.reason : ''];
    D.judges.forEach(j => { const e = r.ent.find(x => x.judge === j.no); row.push(e ? e.raw : '', e ? e.z.toFixed(3) : ''); });
    return row;
  });
  download(`AX우수사례_심사결과_${stamp()}${C.complete ? '' : '_잠정'}.csv`, [head, ...rows]);
}
function exportItems() {
  const head = ['심사위원','번호','사례명','상태', ...CRIT.map((c, i) => `문항${i + 1} ${c.name}(${c.max})`), '합계','심사의견','저장시각'];
  const rows = D.scores.slice().sort((a, b) => a.judge_no - b.judge_no || a.team_no - b.team_no).map(s => [
    jname(s.judge_no), s.team_no, D.teams.find(t => t.team_no === s.team_no)?.title, s.submitted ? '전송' : isFull(s) ? '평가 완료(전송 전)' : '작성 중',
    ...s.items.map(v => v ?? ''), sum(s.items), s.comment, new Date(s.updated_at).toLocaleString('ko-KR')]);
  download(`AX우수사례_문항별점수_${stamp()}.csv`, [head, ...rows]);
}
